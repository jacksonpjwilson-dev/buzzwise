# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: buzzwise
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
